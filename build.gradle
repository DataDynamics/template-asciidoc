plugins {
	id 'base'
	id 'org.asciidoctor.jvm.convert' version '4.0.5'
	id 'org.asciidoctor.jvm.pdf' version '4.0.5'
}

group = 'io.datadynamics.asciidoc'
description = 'AsciiDoc 문서를 HTML 과 PDF 로 생성하는 문서 템플릿'

// 도구 버전. 문서 본문(introduction.adoc)의 "필요한 소프트웨어" 표에도 속성으로 전달됩니다.
// Asciidoctor Gradle Plugin 버전은 plugins 블록에서 바꾸면 자동으로 반영됩니다.
def asciidoctorjVersion = '3.0.1'
def asciidoctorjPdfVersion = '2.3.27'

repositories {
	mavenCentral()
}

configurations {
	documentation
}

// 모든 변환 태스크에 공통으로 전달하는 문서 속성.
// 문서 헤더(index.adoc)에 같은 속성이 있어도 여기 값이 우선합니다.
def docAttributes = [
	'project-version'  : project.version,
	'revnumber'        : project.version,
	'revdate'          : java.time.LocalDate.now().toString(),
	'attribute-missing': 'warn',
	'gradle-version'   : gradle.gradleVersion,
	'asciidoctor-gradle-plugin-version': org.asciidoctor.gradle.jvm.AsciidoctorJPlugin.package.implementationVersion ?: 'unknown',
	'asciidoctorj-version'    : asciidoctorjVersion,
	'asciidoctorj-pdf-version': asciidoctorjPdfVersion,
]

asciidoctorj {
	version = asciidoctorjVersion
	modules {
		pdf {
			version asciidoctorjPdfVersion
		}
	}
	attributes docAttributes
}

asciidoctor {
	sourceDir file('src/docs/asciidoc')
	sources {
		// 변환할 문서 목록. 각 문서는 같은 이름의 HTML/PDF 로 생성됩니다.
		include 'index.adoc', 'sample-manual.adoc', 'k3stui-manual.adoc'
	}
	baseDirFollowsSourceDir()
	// 깨진 참조, 누락된 속성, 없는 include 파일을 빌드 실패로 처리합니다.
	failureLevel = 'WARN'
}

asciidoctorPdf {
	sourceDir file('src/docs/asciidoc')
	sources {
		// 변환할 문서 목록. 각 문서는 같은 이름의 HTML/PDF 로 생성됩니다.
		include 'index.adoc', 'sample-manual.adoc', 'k3stui-manual.adoc'
	}
	baseDirFollowsSourceDir()
	failureLevel = 'WARN'
	// GEM_FONTS_DIR 를 함께 지정해야 기본 테마(extends: default)의 글꼴을 찾을 수 있습니다.
	attributes 'pdf-theme': file('src/docs/theme/DataDynamics-theme.yml').absolutePath,
	           'pdf-fontsdir': "${file('src/docs/theme').absolutePath};GEM_FONTS_DIR"
}

def zipDocs = tasks.register('zip', Zip) {
	dependsOn tasks.named('asciidoctor'), tasks.named('asciidoctorPdf')
	duplicatesStrategy = DuplicatesStrategy.FAIL
	from(tasks.named('asciidoctorPdf').map { it.outputDir }) {
		into 'reference/pdf'
		rename 'index.pdf', "${project.name}-reference.pdf"
	}
	from(tasks.named('asciidoctor').map { it.outputDir }) {
		into 'reference/htmlsingle'
		rename 'index.html', "${project.name}-reference.html"
	}
}

artifacts {
	documentation zipDocs
}

tasks.named('build') {
	dependsOn zipDocs
}

configurations.configureEach {
	resolutionStrategy.cacheChangingModulesFor 0, 'minutes'
}
