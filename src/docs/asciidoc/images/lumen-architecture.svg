  </defs>
  <!-- 사용자와 외부 시스템 -->
  <rect x="10" y="30" width="130" height="50" rx="6" fill="#FFFFFF" stroke="#5C6266" stroke-width="1.5"/>
  <text x="75" y="60" font-size="14" text-anchor="middle" fill="#333333">사용자</text>
  <rect x="10" y="150" width="130" height="50" rx="6" fill="#FFFFFF" stroke="#5C6266" stroke-width="1.5"/>
  <text x="75" y="180" font-size="14" text-anchor="middle" fill="#333333">외부 시스템</text>
  <!-- Lumen -->
  <rect x="180" y="10" width="300" height="230" rx="8" fill="#F4F6F8" stroke="#DDE3EA" stroke-width="1.5"/>
  <text x="330" y="32" font-size="13" text-anchor="middle" fill="#5C6266">Lumen 지식 검색</text>
  <rect x="200" y="45" width="120" height="50" rx="6" fill="#EEF3F8" stroke="#005498" stroke-width="1.5"/>
  <text x="260" y="75" font-size="14" text-anchor="middle" fill="#005498">웹 콘솔</text>
  <rect x="200" y="140" width="120" height="50" rx="6" fill="#EEF3F8" stroke="#005498" stroke-width="1.5"/>
  <text x="260" y="170" font-size="14" text-anchor="middle" fill="#005498">API 서버</text>
  <rect x="345" y="45" width="120" height="50" rx="6" fill="#EEF3F8" stroke="#005498" stroke-width="1.5"/>
  <text x="405" y="75" font-size="14" text-anchor="middle" fill="#005498">색인 노드</text>
  <rect x="345" y="140" width="120" height="50" rx="6" fill="#EEF3F8" stroke="#005498" stroke-width="1.5"/>
  <text x="405" y="170" font-size="14" text-anchor="middle" fill="#005498">저장소</text>
  <!-- 외부 저장소 -->
  <rect x="510" y="45" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#5C6266" stroke-width="1.5"/>
  <text x="570" y="68" font-size="14" text-anchor="middle" fill="#333333">외부 저장소</text>
  <text x="570" y="85" font-size="11" text-anchor="middle" fill="#5C6266">공유 폴더 · S3 · 위키</text>
  <!-- 연결 -->
  <line x1="140" y1="55" x2="196" y2="65" stroke="#5C6266" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="175" x2="196" y2="165" stroke="#5C6266" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="95" x2="260" y2="136" stroke="#5C6266" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="165" x2="341" y2="165" stroke="#5C6266" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="405" y1="95" x2="405" y2="136" stroke="#5C6266" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="70" x2="469" y2="70" stroke="#5C6266" stroke-width="1.5" marker-end="url(#arrow)"/>
