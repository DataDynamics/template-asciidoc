# DataDynamics PDF 테마
#
# Asciidoctor PDF 기본 테마를 상속하고 바꾸는 항목만 정의합니다.
# 기본 테마의 전체 키 목록은 https://docs.asciidoctor.org/pdf-converter/latest/theme/ 를 참고하십시오.
extends: default

font:
  catalog:
    # 기본 테마의 Noto Serif, M+ 1mn 글꼴을 함께 유지합니다 (콜아웃 숫자, 제로폭 공백 처리에 사용).
    merge: true
    # 본문용 한글 글꼴. 굵게/기울임 글꼴 파일이 실제로 있어 제목이 올바르게 굵게 표시됩니다.
    KaiGen Gothic KR:
      normal: KaiGenGothicKR-Regular.ttf
      bold: KaiGenGothicKR-Bold.ttf
      italic: KaiGenGothicKR-Regular-Italic.ttf
      bold_italic: KaiGenGothicKR-Bold-Italic.ttf
    # 코드용 글꼴. 한글 주석도 표시됩니다.
    D2Coding:
      normal: D2Coding.ttf
      bold: D2CodingBold.ttf
      italic: D2Coding.ttf
      bold_italic: D2CodingBold.ttf
  fallbacks:
    # 코드 글꼴에 없는 글리프는 본문 글꼴로 대체합니다.
    - KaiGen Gothic KR
    # URL 줄바꿈을 위해 Asciidoctor PDF가 삽입하는 U+200B(제로폭 공백)를 지원합니다.
    - Noto Serif

# 브랜드 색상. 제목, 캡션, 표 머리글, 표지에서 공통으로 참조합니다.
brand:
  primary: 005498
  secondary: 5C6266
  accent: B12146

page:
  margin: [0.6in, 0.7in, 0.7in, 0.7in]
  size: A4

base:
  font_family: KaiGen Gothic KR
  font_size: 10.5
  # 한글 본문은 영문보다 행간을 조금 넓게 잡는 편이 읽기 좋습니다.
  line_height_length: 15
  line_height: $base_line_height_length / $base_font_size
  text_align: justify

link:
  font_color: $brand_primary

codespan:
  font_family: D2Coding
  font_color: $brand_accent
  font_size: $base_font_size * 0.9

code:
  font_family: D2Coding
  font_size: $base_font_size * 0.85
  line_height: 1.35
  background_color: F7F7F9
  border_color: DDDDDD

# 콜아웃 번호(원문자)는 본문 글꼴로 그립니다. 글꼴이 다르면 콜아웃 목록에서 번호가 글줄 위로 떠 보입니다.
conum:
  font_family: $base_font_family
  font_color: $brand_accent
  line_height: $base_line_height

heading:
  font_color: $brand_primary
  font_style: bold
  line_height: 1.25
  margin_top: $vertical_rhythm * 0.6
  margin_bottom: $vertical_rhythm * 0.6

caption:
  font_color: $brand_secondary
  font_size: $base_font_size * 0.9

title_page:
  text_align: center
  # 로고를 쓰려면 아래 주석을 해제하고 images/logo.png 를 추가하십시오.
  #logo:
  #  image: image:logo.png[pdfwidth=40%]
  #  top: 10%
  title:
    top: 38%
    font_size: $heading_h1_font_size
    font_color: $brand_primary
    font_style: bold
    line_height: 1.1
  subtitle:
    font_size: $heading_h3_font_size
    font_color: $brand_secondary
    font_style: normal
  authors:
    margin_top: $base_font_size * 3
    font_size: $base_font_size_large
    font_color: 333333
  revision:
    margin_top: $base_font_size * 0.5
    font_color: $brand_secondary

admonition:
  icon:
    note:
      stroke_color: $brand_primary
    tip:
      stroke_color: 2E7D32
    important:
      stroke_color: $brand_accent
    warning:
      stroke_color: E65100
    caution:
      stroke_color: BF360C
  label:
    font_color: $brand_secondary

table:
  font_size: $base_font_size * 0.9
  border_color: DDDDDD
  cell_padding: [4, 6, 4, 6]
  head:
    background_color: EEF3F8
    font_color: $brand_primary
    border_bottom_color: $brand_primary
  body:
    stripe_background_color: FAFAFA

image:
  align: center

sidebar:
  background_color: F4F6F8
  border_color: DDE3EA
  title:
    font_color: $brand_primary

example:
  border_color: DDDDDD

quote:
  font_color: 555555
  border_color: $brand_primary

description_list:
  term_font_color: 222222

toc:
  font_color: 333333
  title:
    font_color: $brand_primary
  dot_leader:
    font_color: CCCCCC

footer:
  font_color: 666666
  border_color: DDDDDD
  recto:
    left:
      content: '{section-or-chapter-title}'
    right:
      content: '{page-number} / {page-count}'
  verso:
    left:
      content: '{page-number} / {page-count}'
    right:
      content: '{chapter-title}'
