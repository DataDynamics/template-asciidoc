# KaiGenGothicKR PDF 테마
#
# DataDynamics 테마의 대안으로 쓰는 단순한 테마입니다.
# 본문은 KaiGen Gothic KR, 코드는 Roboto Mono 로 표시하고 브랜드 색상 없이 회색 위주로 꾸밉니다.
# Asciidoctor PDF 기본 테마를 상속하고 바꾸는 항목만 정의합니다.
# 기본 테마의 전체 키 목록은 https://docs.asciidoctor.org/pdf-converter/latest/theme/ 를 참고하십시오.
extends: default

font:
  catalog:
    # 기본 테마의 Noto Serif, M+ 1mn 글꼴을 함께 유지합니다 (콜아웃 숫자 처리에 사용).
    merge: true
    # 본문용 한글 글꼴
    KaiGen Gothic KR:
      normal: KaiGenGothicKR-Regular.ttf
      bold: KaiGenGothicKR-Bold.ttf
      italic: KaiGenGothicKR-Regular-Italic.ttf
      bold_italic: KaiGenGothicKR-Bold-Italic.ttf
    # 코드용 글꼴. 한글은 대체 글꼴(KaiGen Gothic KR)로 표시됩니다.
    Roboto Mono:
      normal: RobotoMono-Regular.ttf
      bold: RobotoMono-Bold.ttf
      italic: RobotoMono-Italic.ttf
      bold_italic: RobotoMono-BoldItalic.ttf
  fallbacks:
    # 코드 글꼴에 없는 글리프는 본문 글꼴로 대체합니다.
    - KaiGen Gothic KR
    # 기본 테마가 쓰는 특수 공백(U+200B 제로폭 공백, U+202F 좁은 줄바꿈 없는 공백)을 지원합니다.
    - Noto Serif

page:
  margin: [0.5in, 0.67in, 0.67in, 0.67in]
  size: A4

base:
  font_family: KaiGen Gothic KR
  font_color: 333333
  font_size: 9
  line_height_length: 15
  line_height: $base_line_height_length / $base_font_size
  border_color: EEEEEE

link:
  font_color: 428BCA

codespan:
  font_family: Roboto Mono
  font_color: B12146

code:
  font_family: Roboto Mono
  font_size: 9
  line_height: 1.25
  background_color: F5F5F5
  border_color: CCCCCC

# 콜아웃 번호(원문자)는 본문 글꼴로 그립니다. 글꼴이 다르면 콜아웃 목록에서 번호가 글줄 위로 떠 보입니다.
conum:
  font_family: $base_font_family
  font_color: $codespan_font_color
  line_height: $base_line_height

heading:
  font_color: $base_font_color
  font_style: bold
  line_height: 1.2
  margin_top: $vertical_rhythm * 0.2
  margin_bottom: $vertical_rhythm * 0.8

caption:
  font_style: italic

title_page:
  text_align: right
  title:
    top: 55%
    font_size: $heading_h1_font_size
    font_color: 999999
    line_height: 0.9
  subtitle:
    font_size: $heading_h3_font_size
    font_style: bold_italic
  authors:
    margin_top: $base_font_size * 1.25
    font_size: $base_font_size_large
    font_color: 181818
  revision:
    margin_top: $base_font_size * 1.25

table:
  border_color: DDDDDD
  cell_padding: [3, 3, 6, 3]
  body:
    stripe_background_color: F9F9F9
  foot:
    background_color: F0F0F0

sidebar:
  background_color: EEEEEE

description_list:
  term_font_style: italic

toc:
  dot_leader:
    font_color: DDDDDD

footer:
  font_color: $base_font_color
  border_color: DDDDDD
  # 쪽 번호는 모든 쪽의 왼쪽 아래에만 표시합니다. 기본 테마의 오른쪽 쪽 번호는 ~ 로 지웁니다.
  recto:
    left:
      content: '{page-number}'
    right:
      content: ~
  verso:
    left:
      content: '{page-number}'
